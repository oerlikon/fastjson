name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  audit:
    name: Audit
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - uses: actions/checkout@v6
    - run: go vet ./...
    - run: go test -vet=off ./...
